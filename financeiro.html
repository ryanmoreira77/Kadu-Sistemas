<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kadu Camisas de Time — Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="header-root"></div>

    <div class="page-content">
      <section class="stats" id="finStats"></section>

      <div class="charts-row">
        <div class="panel anim-fade-up">
          <h3>💎 Produtos mais caros</h3>
          <p class="sub">Top 5 por preço de venda</p>
          <div class="rank-list" id="rankMaisCaros"></div>
        </div>
        <div class="panel anim-fade-up">
          <h3>🐌 Produtos parados</h3>
          <p class="sub" id="paradosSub">Sem vendas nos últimos 30 dias</p>
          <div class="rank-list" id="rankParados"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/brand.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/financeiro.js"></script>
</body>
</html>
