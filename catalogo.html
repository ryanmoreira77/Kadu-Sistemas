<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kadu Camisas de Time — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="header-root"></div>

    <div class="page-content">
      <div class="panel anim-fade-up" style="margin-bottom:20px;">
        <h3>📸 Catálogo para clientes</h3>
        <p class="sub">Escolha as camisas (só entram no PDF as que já têm foto cadastrada em Produtos) e gere um catálogo pronto para enviar por WhatsApp ou e-mail.</p>

        <div class="toolbar" style="margin-bottom:0;">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="searchCatalogo" type="text" placeholder="Buscar por nome, time, marca ou temporada...">
          </div>
          <select id="filterCategoriaCat">
            <option value="">Todas as categorias</option>
            <option value="Titular">Titular</option>
            <option value="Reserva">Reserva</option>
            <option value="Terceiro">Terceiro</option>
            <option value="Retrô">Retrô</option>
          </select>
          <button class="btn-secondary" id="btnSelecionarTodos">Selecionar todos</button>
          <button class="btn-secondary" id="btnLimparSelecao">Limpar seleção</button>
          <button class="btn-primary" id="btnGerarPdf">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 3h8l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M9 12h6M9 16h6M9 8h2"/></svg>
            Gerar catálogo em PDF
          </button>
        </div>
      </div>

      <div id="semFotoAviso" class="field-hint" style="margin:-10px 0 16px;"></div>

      <section class="grid" id="catalogoGrid"></section>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
  <img id="lightboxImg" src="" alt="Foto ampliada">
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/brand.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabaseClient.js"></script>
<script src="assets/js/auth-cloud.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/catalogo.js"></script>
</body>
</html>
