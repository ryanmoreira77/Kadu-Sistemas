<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kadu Camisas de Time — Produtos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="header-root"></div>

    <div class="page-content">
      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="searchInput" type="text" placeholder="Buscar por nome, time, liga, temporada, marca ou tamanho...">
        </div>
        <select id="filterCategoria">
          <option value="">Todas as categorias</option>
          <option value="Titular">Titular</option>
          <option value="Reserva">Reserva</option>
          <option value="Terceiro">Terceiro</option>
          <option value="Retrô">Retrô</option>
        </select>
        <select id="filterTamanho">
          <option value="">Todos os tamanhos</option>
          <option value="PP">PP</option><option value="P">P</option><option value="M">M</option>
          <option value="G">G</option><option value="XL">XL</option><option value="2XL">2XL</option>
          <option value="3XL">3XL</option><option value="4XL">4XL</option>
        </select>
        <select id="filterStatus">
          <option value="">Todo o estoque</option>
          <option value="ok">Em estoque</option>
          <option value="low">Estoque baixo</option>
          <option value="out">Esgotado</option>
        </select>
        <div class="view-toggle">
          <button id="btnViewCards" class="active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
            Cards
          </button>
          <button id="btnViewTable">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            Tabela
          </button>
        </div>
        <button class="btn-primary" onclick="openAddModal()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Nova Camisa
        </button>
      </div>

      <div class="chips-row" id="chipsRow"></div>

      <section class="grid" id="grid"></section>

      <div class="table-wrap" id="tableWrap" style="display:none;">
        <div style="display:flex;justify-content:flex-end;padding:12px 14px 0;">
          <div class="col-toggle">
            <button class="table-icon-btn" id="colToggleBtn" style="width:auto;padding:0 12px;gap:6px;display:flex;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
              Colunas
            </button>
            <div class="col-toggle-panel" id="colTogglePanel"></div>
          </div>
        </div>
        <table class="modern">
          <thead><tr id="tableHeadRow"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</div>

<!-- ADD / EDIT MODAL -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="formTitle">Nova Camisa</h2>
      <button onclick="closeFormModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field" id="f-foto">
        <label>Foto da camisa</label>
        <div id="uploadArea"></div>
      </div>

      <div class="field" id="f-nome">
        <label for="inNome">Nome do produto</label>
        <input id="inNome" type="text" placeholder="Ex: Camisa Titular Flamengo 24/25">
        <div class="field-error">Informe o nome do produto.</div>
      </div>

      <div class="field-row">
        <div class="field" id="f-team">
          <label for="inTeam">Time</label>
          <input id="inTeam" type="text" placeholder="Ex: Flamengo">
          <div class="field-error">Informe o time.</div>
        </div>
        <div class="field" id="f-liga">
          <label for="inLiga">Liga</label>
          <input id="inLiga" type="text" placeholder="Ex: Brasileirão">
        </div>
      </div>

      <div class="field-row">
        <div class="field" id="f-temporada">
          <label for="inTemporada">Temporada</label>
          <input id="inTemporada" type="text" placeholder="Ex: 24/25">
        </div>
        <div class="field" id="f-marca">
          <label for="inMarca">Marca</label>
          <input id="inMarca" type="text" placeholder="Ex: Nike">
        </div>
      </div>

      <div class="field-row">
        <div class="field" id="f-modelo">
          <label for="inModelo">Modelo</label>
          <select id="inModelo">
            <option value="Torcedor">Torcedor</option>
            <option value="Jogador">Jogador</option>
          </select>
        </div>
        <div class="field" id="f-categoria">
          <label for="inCategoria">Categoria</label>
          <select id="inCategoria">
            <option value="Titular">Titular</option>
            <option value="Reserva">Reserva</option>
            <option value="Terceiro">Terceiro</option>
            <option value="Retrô">Retrô</option>
          </select>
        </div>
      </div>

      <div class="field" id="f-sku">
        <label for="inSku">Código interno</label>
        <input id="inSku" type="text" placeholder="Gerado automaticamente (ou digite o seu)">
      </div>

      <div class="field-row">
        <div class="field" id="f-custo">
          <label for="inCusto">Preço de custo (R$)</label>
          <input id="inCusto" type="number" min="0" step="0.01" placeholder="0,00">
          <div class="field-error">Informe um preço de custo válido.</div>
        </div>
        <div class="field" id="f-preco">
          <label for="inPreco">Preço de venda (R$)</label>
          <input id="inPreco" type="number" min="0" step="0.01" placeholder="0,00">
          <div class="field-error">Informe um preço de venda válido.</div>
        </div>
      </div>

      <div class="field" id="f-lucro">
        <label>Lucro automático (por unidade)</label>
        <div class="readonly-box" id="lucroPreview">R$ 0,00</div>
      </div>

      <div class="field" id="f-tamanhos">
        <label>Quantidade em estoque por tamanho</label>
        <div class="size-grid" id="sizeGrid"></div>
        <div class="field-hint" id="qtdHint"></div>
      </div>

      <div class="field" id="f-obs">
        <label for="inObs">Observações</label>
        <textarea id="inObs" placeholder="Detalhes adicionais sobre esse produto..."></textarea>
      </div>

      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeFormModal()">Cancelar</button>
        <button class="btn-primary" onclick="saveProduct()">Salvar camisa</button>
      </div>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="overlay" id="confirmOverlay">
  <div class="modal" style="max-width:380px;">
    <div class="modal-header">
      <h2>Remover camisa</h2>
      <button onclick="closeConfirmModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="confirm-body">
      <div class="team-name" id="confirmTeamName"></div>
      <p>Essa camisa e todo o seu histórico de movimentações sairão do sistema e não poderão ser recuperados.</p>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeConfirmModal()">Cancelar</button>
        <button class="btn-primary" style="background:var(--red)" onclick="confirmDelete()">Remover</button>
      </div>
    </div>
  </div>
</div>

<!-- HISTÓRICO MODAL -->
<div class="overlay" id="historicoOverlay">
  <div class="modal" style="max-width:440px;">
    <div class="modal-header">
      <h2 id="historicoTitle">Histórico</h2>
      <button onclick="closeHistoricoModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="timeline" id="timelineBody"></div>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
  <img id="lightboxImg" src="" alt="Foto ampliada">
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/brand.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabaseClient.js"></script>
<script src="assets/js/auth-cloud.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/produtos.js"></script>
</body>
</html>
