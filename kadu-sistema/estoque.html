<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kadu Camisas de Time — Estoque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app-shell">
  <div id="sidebar-root"></div>
  <div class="main">
    <div id="header-root"></div>

    <div class="page-content">
      <div class="panel anim-fade-up" style="margin-bottom:24px;">
        <h3>Registrar movimentação</h3>
        <p class="sub">Entrada, saída, venda ou ajuste de estoque</p>

        <div class="field-row" style="margin-bottom:14px;">
          <div class="field" id="f-produto">
            <label for="movProduto">Produto</label>
            <select id="movProduto"></select>
          </div>
          <div class="field" id="f-tamanhoMov">
            <label for="movTamanho">Tamanho</label>
            <select id="movTamanho"></select>
          </div>
        </div>

        <div class="field-row" style="margin-bottom:14px;">
          <div class="field" id="f-tipo">
            <label for="movTipo">Tipo de movimentação</label>
            <select id="movTipo">
              <option value="Entrada">Entrada</option>
              <option value="Saída">Saída</option>
              <option value="Venda">Venda</option>
              <option value="Ajuste">Ajuste</option>
            </select>
          </div>
          <div class="field" id="f-qtdMov">
            <label for="movQtd" id="movQtdLabel">Quantidade</label>
            <input id="movQtd" type="number" placeholder="0">
            <div class="field-error">Informe uma quantidade válida.</div>
            <div class="field-hint" id="movEstoqueAtual"></div>
          </div>
        </div>

        <div class="field" style="margin-bottom:14px;">
          <label for="movMotivo">Motivo / Fornecedor <span style="opacity:.6">(opcional)</span></label>
          <input id="movMotivo" type="text" placeholder="Ex: Fornecedor ABC Imports">
        </div>

        <div class="field" style="margin-bottom:16px;">
          <label for="movObs">Observação <span style="opacity:.6">(opcional)</span></label>
          <textarea id="movObs" placeholder="Detalhes adicionais sobre essa movimentação..."></textarea>
        </div>

        <button class="btn-primary" onclick="registrarMov()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Registrar movimentação
        </button>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="searchMov" type="text" placeholder="Buscar por time ou motivo...">
        </div>
        <select id="filterTipo">
          <option value="">Todos os tipos</option>
          <option value="Entrada">Entrada</option>
          <option value="Saída">Saída</option>
          <option value="Venda">Venda</option>
          <option value="Ajuste">Ajuste</option>
        </select>
      </div>

      <div class="table-wrap">
        <table class="modern">
          <thead>
            <tr><th>Data</th><th>Produto</th><th>Tamanho</th><th>Tipo</th><th>Quantidade</th><th>Motivo</th><th>Observação</th></tr>
          </thead>
          <tbody id="movTableBody"></tbody>
        </table>
        <div class="pagination" id="movPagination"></div>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/brand.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/js/supabaseClient.js"></script>
<script src="assets/js/auth-cloud.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/estoque.js"></script>
</body>
</html>
